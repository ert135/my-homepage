<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    >

    <title>Robert Smith</title>

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
    >

    <link
      href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap"
      rel="stylesheet"
    >

    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.1.0/css/all.css"
    >

    <link
      rel="stylesheet"
      href="/styles/main.css"
    >
  </head>

  <body>
    <canvas id="battle-background"></canvas>

    <div class="lens"></div>

    <section class="banner">
      <div class="banner__inner">
        <header class="banner__title">
          <h1 class="banner-title_name">
            Robert Smith
          </h1>

          <p class="banner-subtitle">
            Software Engineer
          </p>
        </header>

        <div class="banner__content">
          <ul class="banner__actions">
            <li>
              <a
                class="banner__icon fab fa-linkedin"
                href="https://www.linkedin.com/in/robert-smith-832b7a52/"
                aria-label="LinkedIn"
              ></a>
            </li>

            <li>
              <a
                class="banner__icon fab fa-github"
                href="https://github.com/ert135"
                aria-label="GitHub"
              ></a>
            </li>
          </ul>
        </div>
      </div>
    </section>

    <script
      type="module"
      src="/src/main.js"
    ></script>
  </body>
</html>
